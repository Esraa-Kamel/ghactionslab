name: Jobs & Steps

on:
  workflow_dispatch: #to run the workflow manually without event or scheduled time

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: step 1 in job 1
        run: "echo job ${{github.job}}"
        #shell: bash
        #working-directory: ./temp
  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - name: step 1 in job 2
        run: "echo job ${{github.job}}"

  job-3:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - name: step 1 in job 3
        run: "echo job ${{github.job}}"

  job-4:
    runs-on: ubuntu-latest
    needs: [job-2, job-3]
    steps:
      - name: step 1 in job 4
        run: "echo job ${{github.job}}"
