name: Push & PR Check Tests WF

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"

  pull-request:
    branches:
      - main
      - "release/**"

jobs:
  Test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Step 1 Checkout Repo
        uses: actions/checkout@v6.1.0
      - name: Step 2 Run npm tests
        run: npm test